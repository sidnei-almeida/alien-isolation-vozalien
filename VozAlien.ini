; VozAlien: your microphone becomes in-game noise in Alien: Isolation.
; Log file: VozAlien.log next to AI.exe (the previous run is kept as VozAlien.previous.log).
; Changes take effect the next time the game starts.

[Geral]
Enabled=1
; 1 = every noise sent to the game + a status line every 15 s; 2 = also microphone levels
LogLevel=1
; natural = your voice becomes a movement noise and the game decides everything (recommended)
; forcado = fallback: the mod computes certainty itself and hands it straight to the Alien
Modo=natural

[Microfone]
; Part of the microphone name (empty = system default / PipeWire default source)
Device=
; Stay quiet for this long after the game starts: the room noise is measured here
CalibrationMs=3000
; Speech starts when the level is StartDb above the room noise for AttackMs
StartDb=10
StopDb=6
AttackMs=100
ReleaseMs=350
; Sounds shorter than this (clicks, keys, a short cough) are ignored
MinUtteranceMs=300
; Continuous sound longer than this (fan, music) becomes the new room noise
MaxUtteranceMs=8000
; While you speak, one noise every PostMs (the game posts footsteps every 250 ms).
; Every noise adds to the Alien's hearing meter: talking longer fills it more.
PostMs=250
StaleMs=800

[Voz]
; Loudness handed to the game. The game's own scale: footsteps 0.2 (slow) to 0.6 (running),
; motion tracker beep 0.75-1.0. Range = loudness x 50 m along the walkable path
; (half of that when a vent is involved).
; At 20 dB above your room noise your voice is worth Loudness20dB; every +6 dB doubles it:
;   ~8 dB 0.07 | 14 dB 0.15 | 20 dB 0.30 | 26 dB 0.60 | 32+ dB 1.0
Loudness20dB=0.30
LoudnessMax=1.0
LoudnessMin=0.03

[Imprecisao]
; Far away, the Alien does not know exactly where the voice came from: the noise is
; placed at a spot you walked through recently, (Fraction x distance) metres from you,
; never closer to the Alien than you are. Within StartDistance metres: exact position.
Enabled=1
StartDistance=8
Fraction=0.30
Max=15
; "Effective" distance multiplier when the Alien is in a vent (the game also uses x2)
VentDistanceMultiplier=2

[Teste]
; Keys that simulate one second of speech (to test without shouting). 0 = off.
Hotkeys=0
; F7 = 0x76, F8 = 0x77
KeyLow=0x76
KeyHigh=0x77
KeyLowDb=18
KeyHighDb=32

[ModoForcado]
; Only used with Modo=forcado.
Radius20dB=8
MaxRadius=40
VerticalFactor=2
UpperRatio=0.20
ActivatedRatio=0.45
LowerRatio=0.70
MemoryMs=20000
RepeatCooldownMs=2500
MaxEventsPerMinute=20
VentMaxLevel=2
VentNearRatio=0.35
