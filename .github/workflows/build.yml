name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64 (i686)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VozAlien
          path: dist/
