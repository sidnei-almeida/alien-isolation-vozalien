<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ee36b"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f7d66"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b120d"/>
      <stop offset="1" stop-color="#101a13"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="470" rx="14" fill="url(#bg)"/>

  <!-- row 1 -->
  <g>
    <rect x="30" y="50" width="230" height="96" rx="10" fill="#131c16" stroke="#2f5c39" stroke-width="2"/>
    <text x="145" y="92" text-anchor="middle" font-size="22" font-weight="600" fill="#e6efe8">Microphone</text>
    <text x="145" y="120" text-anchor="middle" font-size="15" fill="#9fb3a5">your real voice</text>
  </g>
  <g>
    <rect x="350" y="50" width="230" height="96" rx="10" fill="#15241a" stroke="#8ee36b" stroke-width="2.5"/>
    <text x="465" y="92" text-anchor="middle" font-size="22" font-weight="700" fill="#b9f59a">VozAlien</text>
    <text x="465" y="120" text-anchor="middle" font-size="15" fill="#9fb3a5">speech → game loudness</text>
  </g>
  <g>
    <rect x="850" y="50" width="320" height="96" rx="10" fill="#131c16" stroke="#2f5c39" stroke-width="2"/>
    <text x="1010" y="92" text-anchor="middle" font-size="22" font-weight="600" fill="#e6efe8">Game StimulusManager</text>
    <text x="1010" y="120" text-anchor="middle" font-size="15" fill="#9fb3a5">same channel as footsteps</text>
  </g>

  <line x1="260" y1="98" x2="344" y2="98" stroke="#8ee36b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="302" y="80" text-anchor="middle" font-size="13" fill="#9fb3a5">dB above</text>
  <text x="302" y="125" text-anchor="middle" font-size="13" fill="#9fb3a5">room noise</text>

  <line x1="580" y1="98" x2="844" y2="98" stroke="#8ee36b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="712" y="80" text-anchor="middle" font-size="14" fill="#cfe0d4">movement noise every 250 ms</text>
  <text x="712" y="125" text-anchor="middle" font-size="14" fill="#cfe0d4">loudness 0 to 1, at your position</text>

  <!-- side branch: other NPCs -->
  <path d="M900,146 C900,200 760,205 700,215" fill="none" stroke="#5f7d66" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dim)"/>
  <rect x="470" y="196" width="228" height="40" rx="20" fill="#111814" stroke="#3a5442" stroke-width="1.5"/>
  <text x="584" y="222" text-anchor="middle" font-size="15" fill="#9fb3a5">androids and humans hear it too</text>

  <!-- row 2 -->
  <line x1="1010" y1="146" x2="1010" y2="284" stroke="#8ee36b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="850" y="290" width="320" height="120" rx="10" fill="#15241a" stroke="#8ee36b" stroke-width="2.5"/>
    <text x="1010" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#b9f59a">Alien hearing</text>
    <text x="1010" y="358" text-anchor="middle" font-size="15" fill="#cfe0d4">walkable path distance</text>
    <text x="1010" y="381" text-anchor="middle" font-size="15" fill="#cfe0d4">vents halve the range, 50 m max</text>
  </g>

  <line x1="850" y1="350" x2="766" y2="350" stroke="#8ee36b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="430" y="290" width="330" height="120" rx="10" fill="#131c16" stroke="#2f5c39" stroke-width="2"/>
    <text x="595" y="330" text-anchor="middle" font-size="22" font-weight="600" fill="#e6efe8">Hearing meter</text>
    <text x="595" y="358" text-anchor="middle" font-size="15" fill="#cfe0d4">fills while you talk, decays in silence</text>
    <text x="595" y="381" text-anchor="middle" font-size="14" fill="#9fb3a5" letter-spacing="0.5">TRACE › LOWER › ACTIVATED › UPPER</text>
  </g>

  <line x1="430" y1="350" x2="356" y2="350" stroke="#8ee36b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="30" y="290" width="320" height="120" rx="10" fill="#131c16" stroke="#2f5c39" stroke-width="2"/>
    <text x="190" y="330" text-anchor="middle" font-size="22" font-weight="600" fill="#e6efe8">Behaviour tree</text>
    <text x="190" y="358" text-anchor="middle" font-size="15" fill="#cfe0d4">investigate, sweep vents,</text>
    <text x="190" y="381" text-anchor="middle" font-size="15" fill="#cfe0d4">killtrap, break out, attack</text>
  </g>

  <text x="600" y="448" text-anchor="middle" font-size="13" fill="#5f7d66">VozAlien only makes the sound. Everything after the StimulusManager is the game's own AI.</text>
</svg>
